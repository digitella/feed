<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>8 заповедей грудного вскармливания — интерактивное издание</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b1220;
      --paper: #fffdf9;
      --paper-2: #f7f1e8;
      --ink: #2c3e50;
      --muted: #6b7280;
      --soft-muted: #94a3b8;
      --line: #eadfcf;
      --accent: #f2c94c;
      --teal: #006d77;
      --white: #ffffff;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
      --radius: 34px;
      --font: "Nunito", "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(circle at top, #18233a 0%, #0b1220 55%, #08101d 100%);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      overflow: hidden;
    }

    a {
      color: inherit;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 60;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px 0;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(242, 201, 76, 0.18);
      flex: none;
    }

    .brand-text {
      min-width: 0;
    }

    .brand strong {
      display: block;
      font-size: 14px;
      font-weight: 900;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand small {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .counter {
      flex: none;
      font-size: 12px;
      font-weight: 900;
      color: var(--muted);
      background: var(--white);
      border: 1px solid #e5e7eb;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: #e5e7eb;
    }

    .progress i {
      display: block;
      height: 100%;
      width: 11.11%;
      background: linear-gradient(90deg, var(--accent), var(--teal));
      transition: width 0.25s ease;
    }

    .scroller {
      position: relative;
      height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .scroller::-webkit-scrollbar {
      display: none;
    }

    .story {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 78px 16px 126px;
      scroll-snap-align: start;
    }

    .page {
      position: relative;
      width: min(430px, 92vw);
      height: min(765px, calc(100dvh - 205px));
      border-radius: var(--radius);
      overflow: hidden;
      background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.7);
      display: flex;
      flex-direction: column;
      isolation: isolate;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      z-index: 0;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(0.2px);
    }

    .page::before {
      width: 260px;
      height: 260px;
      right: -90px;
      top: -80px;
      background: rgba(243, 232, 219, 0.75);
    }

    .page::after {
      width: 220px;
      height: 220px;
      left: -90px;
      bottom: -70px;
      background: rgba(233, 242, 240, 0.72);
    }

    .page-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 30px 26px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: auto;
      scrollbar-width: none;
    }

    .page-inner::-webkit-scrollbar {
      display: none;
    }

    .pub-tag {
      align-self: flex-start;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--teal);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      padding: 8px 12px;
      border-radius: 999px;
    }

    .cover-title {
      margin: 8px 0 0;
      font-size: clamp(34px, 8.8vw, 50px);
      line-height: 1.02;
      letter-spacing: -0.035em;
      font-weight: 900;
      color: var(--ink);
    }

    .cover-sub {
      margin: 0;
      font-size: clamp(15px, 4vw, 18px);
      line-height: 1.45;
      color: var(--muted);
      font-weight: 600;
    }

    .formula {
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: 0 10px 30px rgba(120, 90, 40, 0.06);
    }

    .formula-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .formula-line {
      display: block;
      font-size: clamp(16px, 4.2vw, 20px);
      line-height: 1.35;
      font-weight: 800;
      color: var(--ink);
      margin: 7px 0;
    }

    .formula-result {
      display: block;
      margin-top: 12px;
      font-size: clamp(17px, 4.5vw, 22px);
      line-height: 1.25;
      font-weight: 900;
      color: var(--teal);
    }

    .toc {
      margin-top: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .toc a {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid var(--line);
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .toc a:hover {
      background: var(--white);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(44, 62, 80, 0.08);
    }

    .toc .num {
      flex: none;
      color: var(--teal);
      font-weight: 900;
    }

    .toc .label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hint {
      margin: 12px 0 0;
      text-align: center;
      color: var(--soft-muted);
      font-size: 13px;
      font-weight: 700;
    }

    .signature {
      margin: 8px 0 0;
      text-align: center;
      color: var(--soft-muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .badge {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: var(--white);
      font-size: 24px;
      font-weight: 900;
      flex: none;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.14);
    }

    .head-text {
      flex: 1;
      min-width: 0;
    }

    .kicker {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 900;
    }

    .title {
      margin: 4px 0 0;
      font-size: clamp(25px, 6.8vw, 34px);
      line-height: 1.08;
      letter-spacing: -0.025em;
      font-weight: 900;
      color: var(--ink);
    }

    .icon {
      flex: none;
      font-size: 34px;
      line-height: 1;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.10));
      transform: translateY(2px);
    }

    .lead {
      margin: 2px 0 0;
      font-size: clamp(16px, 4.3vw, 20px);
      line-height: 1.35;
      font-weight: 900;
      color: var(--teal);
    }

    .points {
      margin: 4px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .points li {
      position: relative;
      padding-left: 22px;
      font-size: clamp(14px, 3.8vw, 17px);
      line-height: 1.42;
      color: var(--ink);
      font-weight: 600;
    }

    .points li::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 0.62em;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(242, 201, 76, 0.18);
    }

    .sources {
      margin-top: auto;
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 14px 16px;
    }

    .sources-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sources-note {
      font-size: 10px;
      font-weight: 800;
      color: var(--soft-muted);
      letter-spacing: 0.02em;
      text-transform: none;
      white-space: nowrap;
    }

    .sources ol {
      margin: 0;
      padding-left: 20px;
      display: grid;
      gap: 6px;
    }

    .sources li {
      font-size: clamp(12px, 3.1vw, 13.5px);
      line-height: 1.35;
      color: var(--muted);
      font-weight: 600;
    }

    .source-link {
      text-decoration: none;
      border-bottom: 1px dotted currentColor;
      font-weight: 900;
      transition: border-bottom-color 0.18s ease, opacity 0.18s ease;
    }

    .source-link:hover {
      border-bottom-style: solid;
      opacity: 0.9;
    }

    .source-link.ru {
      color: var(--ink);
    }

    .source-link.en {
      color: var(--teal);
    }

    .ext {
      font-size: 0.85em;
      opacity: 0.72;
      margin-left: 3px;
    }

    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 6px;
      color: var(--soft-muted);
      font-size: 11px;
      font-weight: 800;
    }

    .bottombar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 -12px 34px rgba(0, 0, 0, 0.14);
    }

    .icon-btn,
    .text-btn,
    .dot {
      appearance: none;
      border: 1px solid #e5e7eb;
      background: var(--white);
      color: #111827;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .icon-btn:hover,
    .text-btn:hover,
    .dot:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .icon-btn:active,
    .text-btn:active,
    .dot:active {
      transform: translateY(0);
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 900;
      flex: none;
    }

    .text-btn {
      height: 44px;
      padding: 0 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 900;
      flex: none;
    }

    #nextBtn {
      background: var(--accent);
      border-color: var(--accent);
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 128px;
      flex: 1 1 160px;
    }

    .dot {
      width: 8px;
      height: 8px;
      min-width: 8px;
      padding: 0;
      border-radius: 999px;
      background: #cbd5e1;
      border: none;
    }

    .dot.active {
      width: 24px;
      background: var(--accent);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%) translateY(18px);
      opacity: 0;
      pointer-events: none;
      z-index: 80;
      background: #111827;
      color: var(--white);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.25);
      transition: opacity 0.22s ease, transform 0.22s ease;
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 380px) {
      .dots {
        order: 5;
        flex-basis: 100%;
        min-width: 0;
      }

      .bottombar {
        row-gap: 8px;
      }
    }

    @media print {
      html, body {
        background: white;
        overflow: visible;
        height: auto;
      }

      .topbar,
      .bottombar,
      .toast {
        display: none !important;
      }

      .scroller {
        height: auto;
        overflow: visible;
        scroll-snap-type: none;
      }

      .story {
        min-height: auto;
        padding: 0;
        page-break-after: always;
        break-after: page;
      }

      .page {
        width: 100%;
        height: auto;
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
        background: white;
        break-inside: avoid;
      }

      .page::before,
      .page::after {
        display: none;
      }

      .page-inner {
        overflow: visible;
        padding: 14mm;
      }

      .sources {
        background: #fafafa;
      }

      .source-link {
        border-bottom: none;
        text-decoration: underline;
      }

      .source-link.ru {
        color: #111827 !important;
      }

      .source-link.en {
        color: #005f66 !important;
      }
    }

    @page {
      size: portrait;
      margin: 0;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div class="brand-text">
        <strong>8 заповедей ГВ</strong>
        <small>интерактивное издание для публикации</small>
      </div>
    </div>
    <div class="counter" id="counter">1 / 9</div>
    <div class="progress"><i id="progressBar"></i></div>
  </header>

  <main class="scroller" id="deck"></main>

  <div class="toast" id="toast"></div>

  <nav class="bottombar" aria-label="Управление изданием">
    <button class="icon-btn" id="prevBtn" aria-label="Предыдущий слайд">←</button>
    <div class="dots" id="dots"></div>
    <button class="icon-btn" id="nextBtn" aria-label="Следующий слайд">→</button>
    <button class="text-btn" id="printBtn">PDF</button>
    <button class="text-btn" id="shareBtn">Поделиться</button>
  </nav>

  <script>
    const commands = [
      {
        num: 1,
        icon: "🍼",
        color: "#D4A017",
        short: "По требованию",
        title: "Кормление по требованию",
        lead: "Прилагай к груди по первому требованию",
        points: [
          "Признаки голода: причмокивание, повороты головы, сосание кулачка.",
          "Не жди плача — прикладывай раньше.",
          "Ориентир: 8–12 раз в сутки и чаще в первые месяцы.",
          "Частая стимуляция = сигнал мозгу: молока нужно больше."
        ],
        sources: [
          {
            label: "Союз педиатров России",
            url: "https://www.pediatr-russia.ru/",
            lang: "ru"
          },
          {
            label: "American Academy of Pediatrics",
            url: "https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/default.aspx",
            lang: "en"
          },
          {
            label: "ВОЗ: грудное вскармливание",
            url: "https://www.who.int/news-room/fact-sheets/detail/breastfeeding",
            lang: "ru"
          },
          {
            label: "UNICEF: breastfeeding",
            url: "https://www.unicef.org/nutrition/breastfeeding",
            lang: "en"
          }
        ]
      },
      {
        num: 2,
        icon: "👄",
        color: "#64748B",
        short: "Захват",
        title: "Правильный захват",
        lead: "Глубокий и безболезненный захват",
        points: [
          "Ребенок захватывает сосок и большую часть ареолы.",
          "Губы вывернуты наружу — «губки рыбки».",
          "Подбородок плотно прижат к груди.",
          "Если больно: прерви сосание и приложи заново."
        ],
        sources: [
          {
            label: "АКЕВ",
            url: "https://akev.ru/",
            lang: "ru"
          },
          {
            label: "Academy of Breastfeeding Medicine",
            url: "https://www.bfmed.org/protocols/",
            lang: "en"
          }
        ]
      },
      {
        num: 3,
        icon: "🌙",
        color: "#B45309",
        short: "Ночь",
        title: "Ночные кормления",
        lead: "Ночь и раннее утро — пик пролактина",
        points: [
          "Пролактин отвечает за производство молока.",
          "Ночные кормления поддерживают лактацию.",
          "Частый пропуск ночи может снизить количество молока.",
          "Организуй безопасное ночное кормление рядом с мамой."
        ],
        sources: [
          {
            label: "ESPGHAN",
            url: "https://espghan.org/",
            lang: "en"
          },
          {
            label: "Минздрав РФ: клинические рекомендации",
            url: "https://cr.minzdrav.gov.ru/",
            lang: "ru"
          }
        ]
      },
      {
        num: 4,
        icon: "🚫",
        color: "#006D77",
        short: "Без сосок",
        title: "Нет сосочкам и бутылочкам",
        lead: "Первые месяцы — только грудь",
        points: [
          "До 6 месяцев: грудное молоко, без воды.",
          "Соски и бутылочки меняют паттерн сосания.",
          "«Путаница сосков» ухудшает опорожнение груди.",
          "Итог: риск снижения выработки молока."
        ],
        sources: [
          {
            label: "CDC: breastfeeding",
            url: "https://www.cdc.gov/breastfeeding/index.htm",
            lang: "en"
          },
          {
            label: "ВОЗ: глобальная стратегия вскармливания",
            url: "https://www.who.int/publications/i/item/9241562686",
            lang: "ru"
          },
          {
            label: "Chinese Nutrition Society",
            url: "http://www.cnsoc.org/",
            lang: "en"
          }
        ]
      },
      {
        num: 5,
        icon: "🥗",
        color: "#2A9D8F",
        short: "Питание",
        title: "Питание и питье",
        lead: "Разнообразное питание, питье по жажде",
        points: [
          "Овощи, белок, крупы, полезные жиры.",
          "Строгие диеты истощают мать, но не улучшают молоко.",
          "Держи стакан воды рядом во время кормления.",
          "Насильное питье литрами ≠ больше молока."
        ],
        sources: [
          {
            label: "National Health Commission of the PRC",
            url: "http://en.nhc.gov.cn/",
            lang: "en"
          },
          {
            label: "EFSA: dietary reference values",
            url: "https://www.efsa.europa.eu/en/topics/topic/dietary-reference-values",
            lang: "en"
          },
          {
            label: "Союз педиатров России",
            url: "https://www.pediatr-russia.ru/",
            lang: "ru"
          }
        ]
      },
      {
        num: 6,
        icon: "🤱",
        color: "#E76F51",
        short: "Покой",
        title: "Покой и контакт",
        lead: "Покой и контакт «кожа к коже»",
        points: [
          "Стресс блокирует окситоцин — выброс молока.",
          "Делегируй дела: отдых и кормление важнее.",
          "Контакт кожа к коже стабилизирует малыша.",
          "Такой контакт усиливает гормональный отклик мамы."
        ],
        sources: [
          {
            label: "Academy of Breastfeeding Medicine",
            url: "https://www.bfmed.org/protocols/",
            lang: "en"
          },
          {
            label: "UNICEF: breastfeeding",
            url: "https://www.unicef.org/nutrition/breastfeeding",
            lang: "en"
          },
          {
            label: "ВОЗ: Baby-friendly hospital initiative",
            url: "https://www.who.int/initiatives/baby-friendly-hospital-initiative",
            lang: "ru"
          }
        ]
      },
      {
        num: 7,
        icon: "⚖️",
        color: "#7C3AED",
        short: "Сцеживание",
        title: "Не сцеживай без нужды",
        lead: "Не сцеживай «до дна» без нужды",
        points: [
          "Полное сцеживание после кормления создает ложный спрос.",
          "Риск: гиперлактация, лактостаз, мастит.",
          "Сцеживай до облегчения при сильном распирании.",
          "Или при временном разлучении с малышом."
        ],
        sources: [
          {
            label: "ABM Protocol #20: Engorgement",
            url: "https://www.bfmed.org/protocol-20-management-of-engorgement/",
            lang: "en"
          },
          {
            label: "АКЕВ: сцеживание",
            url: "https://akev.ru/",
            lang: "ru"
          }
        ]
      },
      {
        num: 8,
        icon: "🚨",
        color: "#DC2626",
        short: "Помощь",
        title: "Обращайся за помощью",
        lead: "ГВ не должно быть подвигом через боль",
        points: [
          "Стойкая боль или трещины сосков.",
          "Уплотнение, покраснение, температура.",
          "Меньше 6–8 мокрых подгузников в сутки.",
          "Обратись к консультанту или врачу без промедления."
        ],
        sources: [
          {
            label: "ESPGHAN: position statements",
            url: "https://espghan.org/clinical-resources/position-statements",
            lang: "en"
          },
          {
            label: "Минздрав РФ: клинические рекомендации",
            url: "https://cr.minzdrav.gov.ru/",
            lang: "ru"
          },
          {
            label: "AAP / HealthyChildren",
            url: "https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/default.aspx",
            lang: "en"
          }
        ]
      }
    ];

    const deck = document.getElementById("deck");
    const dotsEl = document.getElementById("dots");
    const counterEl = document.getElementById("counter");
    const progressBar = document.getElementById("progressBar");
    const toast = document.getElementById("toast");

    const totalSlides = commands.length + 1;

    function sourceHTML(source) {
      const cls = source.lang === "en" ? "en" : "ru";
      return `
        <a
          class="source-link ${cls}"
          href="${source.url}"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="${source.label}: открыть источник"
        >
          ${source.label}<span class="ext">↗</span>
        </a>
      `;
    }

    function renderCover() {
      const section = document.createElement("section");
      section.className = "story";
      section.id = "slide-1";

      const toc = commands
        .map((cmd, idx) => {
          const slideIndex = idx + 2;
          const num = String(cmd.num).padStart(2, "0");
          return `
            <a href="#slide-${slideIndex}" aria-label="Открыть заповедь ${cmd.num}: ${cmd.title}">
              <span class="num">${num}</span>
              <span class="label">${cmd.short}</span>
            </a>
          `;
        })
        .join("");

      section.innerHTML = `
        <article class="page cover-page">
          <div class="page-inner">
            <div class="pub-tag">Открытое издание • Выпуск 1</div>

            <h1 class="cover-title">8 заповедей<br>грудного вскармливания</h1>

            <p class="cover-sub">
              Практичный вертикальный гид для мамы, папы, родственников и специалистов.
              Формат подходит для Telegram, Instagram и мобильного чтения.
            </p>

            <div class="formula">
              <p class="formula-title">Главный секрет успеха</p>
              <span class="formula-line">Частое эффективное удаление молока</span>
              <span class="formula-line">+ твое спокойствие</span>
              <span class="formula-line">+ поддержка профессионалов</span>
              <span class="formula-result">= стабильная лактация и здоровье</span>
            </div>

            <div class="toc" aria-label="Содержание">
              ${toc}
            </div>

            <p class="hint">Листай снизу или используй кнопки внизу</p>
            <p class="signature">
              Подготовлено: врач акушер-гинеколог.<br>
              Не заменяет очный осмотр при боли, температуре или плохой прибавке веса.
            </p>
          </div>
        </article>
      `;

      deck.appendChild(section);
    }

    function renderCommandSlides() {
      commands.forEach((cmd, idx) => {
        const slideNumber = idx + 2;
        const section = document.createElement("section");
        section.className = "story";
        section.id = `slide-${slideNumber}`;

        const points = cmd.points.map((p) => `<li>${p}</li>`).join("");
        const sources = cmd.sources.map((s) => `<li>${sourceHTML(s)}</li>`).join("");

        section.innerHTML = `
          <article class="page">
            <div class="page-inner">
              <div class="head">
                <div class="badge" style="background:${cmd.color}">${cmd.num}</div>
                <div class="head-text">
                  <div class="kicker">Заповедь №${cmd.num}</div>
                  <h2 class="title">${cmd.title}</h2>
                </div>
                <div class="icon" aria-hidden="true">${cmd.icon}</div>
              </div>

              <p class="lead">${cmd.lead}</p>

              <ul class="points">
                ${points}
              </ul>

              <aside class="sources" aria-label="Источники">
                <div class="sources-title">
                  <span>Источники</span>
                  <span class="sources-note">сноски кликабельны</span>
                </div>
                <ol>
                  ${sources}
                </ol>
              </aside>

              <div class="slide-footer">
                <span>8 заповедей ГВ</span>
                <span>${slideNumber} / ${totalSlides}</span>
              </div>
            </div>
          </article>
        `;

        deck.appendChild(section);
      });
    }

    function renderDots() {
      dotsEl.innerHTML = "";
      for (let i = 0; i < totalSlides; i++) {
        const dot = document.createElement("button");
        dot.className = "dot";
        dot.dataset.index = String(i);
        dot.setAttribute("aria-label", `Перейти к слайду ${i + 1}`);
        dotsEl.appendChild(dot);
      }
    }

    function getSections() {
      return Array.from(document.querySelectorAll(".story"));
    }

    function setActive(index) {
      const sections = getSections();
      const safeIndex = Math.max(0, Math.min(sections.length - 1, index));
      const dots = Array.from(dotsEl.querySelectorAll(".dot"));

      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === safeIndex);
      });

      counterEl.textContent = `${safeIndex + 1} / ${totalSlides}`;
      progressBar.style.width = `${((safeIndex + 1) / totalSlides) * 100}%`;
    }

    function goTo(index) {
      const sections = getSections();
      const safeIndex = Math.max(0, Math.min(sections.length - 1, index));
      const target = sections[safeIndex];

      deck.scrollTo({
        top: target.offsetTop,
        behavior: "smooth"
      });

      setActive(safeIndex);
    }

    function updateActiveOnScroll() {
      const sections = getSections();
      const scrollTop = deck.scrollTop;
      let activeIndex = 0;

      sections.forEach((section, index) => {
        if (scrollTop >= section.offsetTop - 90) {
          activeIndex = index;
        }
      });

      setActive(activeIndex);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    async function shareCurrentSlide() {
      const sections = getSections();
      const url = `${location.origin}${location.pathname}#slide-${activeIndex() + 1}`;

      let title = "8 заповедей грудного вскармливания";
      let text = "Интерактивное вертикальное издание по грудному вскармливанию.";

      const current = activeIndex();
      if (current > 0) {
        const cmd = commands[current - 1];
        title = `Заповедь №${cmd.num}: ${cmd.title}`;
        text = cmd.lead;
      }

      if (navigator.share) {
        try {
          await navigator.share({ title, text, url });
        } catch (err) {
          // пользователь мог отменить обмен
        }
      } else {
        try {
          await navigator.clipboard.writeText(url);
          showToast("Ссылка на текущий слайд скопирована");
        } catch (err) {
          showToast("Не удалось скопировать ссылку");
        }
      }
    }

    function activeIndex() {
      const sections = getSections();
      const scrollTop = deck.scrollTop;
      let index = 0;

      sections.forEach((section, i) => {
        if (scrollTop >= section.offsetTop - 90) {
          index = i;
        }
      });

      return index;
    }

    function bindEvents() {
      document.getElementById("prevBtn").addEventListener("click", () => {
        goTo(activeIndex() - 1);
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        goTo(activeIndex() + 1);
      });

      document.getElementById("printBtn").addEventListener("click", () => {
        showToast("Откроется печать / сохранение в PDF. Ссылки останутся кликабельными.");
        setTimeout(() => window.print(), 250);
      });

      document.getElementById("shareBtn").addEventListener("click", shareCurrentSlide);

      dotsEl.addEventListener("click", (event) => {
        const dot = event.target.closest(".dot");
        if (!dot) return;
        goTo(Number(dot.dataset.index));
      });

      document.addEventListener("click", (event) => {
        const link = event.target.closest('a[href^="#slide-"]');
        if (!link) return;

        event.preventDefault();
        const id = link.getAttribute("href").slice(1);
        const sections = getSections();
        const index = sections.findIndex((s) => s.id === id);
        if (index >= 0) goTo(index);
      });

      let ticking = false;
      deck.addEventListener("scroll", () => {
        if (!ticking) {
          window.requestAnimationFrame(() => {
            updateActiveOnScroll();
            ticking = false;
          });
          ticking = true;
        }
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" || event.key === "ArrowDown" || event.key === "PageDown") {
          event.preventDefault();
          goTo(activeIndex() + 1);
        }

        if (event.key === "ArrowLeft" || event.key === "ArrowUp" || event.key === "PageUp") {
          event.preventDefault();
          goTo(activeIndex() - 1);
        }

        if (event.key === "Home") {
          event.preventDefault();
          goTo(0);
        }

        if (event.key === "End") {
          event.preventDefault();
          goTo(totalSlides - 1);
        }
      });
    }

    function init() {
      renderCover();
      renderCommandSlides();
      renderDots();
      bindEvents();

      const hash = location.hash;
      if (hash && hash.startsWith("#slide-")) {
        const sections = getSections();
        const index = sections.findIndex((s) => s.id === hash.slice(1));
        if (index >= 0) {
          setTimeout(() => goTo(index), 80);
          return;
        }
      }

      setActive(0);
    }

    init();
  </script>
</body>
</html>
